name: daily-discovery-feed
on:
  schedule:
    - cron: '23 5 * * *'   # daily 05:23 UTC (off the :00 herd)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build feed (fails closed — never publishes empty over good)
        run: node scripts/build-feed.mjs solar-explorer/latest.json
      - name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add solar-explorer/latest.json
          git diff --cached --quiet || git commit -m "feed: $(date -u +%F)"
          git push
